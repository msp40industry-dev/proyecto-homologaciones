# Primera prueba privada. Acceso mediante túnel SSH, sin puertos web públicos.
services:
  backend:
    image: "${BACKEND_IMAGE:-${COMPOSE_PROJECT_NAME:-homologaciones}-backend:latest}"
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    env_file: ${APP_ENV_FILE:-.env}
    volumes:
      - type: bind
        source: ${CHROMA_HOST_PATH:-./scripts_index/chroma_db}
        target: /app/scripts_index/chroma_db
        bind:
          create_host_path: false
      - type: bind
        source: ${OUTPUT_HOST_PATH:-./outputs}
        target: /app/outputs
        bind:
          create_host_path: false
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: "${FRONTEND_IMAGE:-${COMPOSE_PROJECT_NAME:-homologaciones}-frontend:latest}"
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    env_file: ${APP_ENV_FILE:-.env}
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8501}:8501"
    volumes:
      - type: bind
        source: ${CHROMA_HOST_PATH:-./scripts_index/chroma_db}
        target: /app/scripts_index/chroma_db
        bind:
          create_host_path: false
      - type: bind
        source: ${OUTPUT_HOST_PATH:-./outputs}
        target: /app/outputs
        bind:
          create_host_path: false
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
