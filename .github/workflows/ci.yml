name: Validar y publicar imagenes DEV

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests Python
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENAI_API_KEY: sk-test-placeholder
      PROVEEDOR_RAZONAMIENTO: openai
      PROVEEDOR_REDACCION: openai
      AWS_ACCESS_KEY_ID: testing
      AWS_SECRET_ACCESS_KEY: testing
      AWS_EC2_METADATA_DISABLED: 'true'
      LANGCHAIN_TRACING_V2: 'false'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt pytest==8.3.5
      - name: Comprobar dependencias y ejecutar tests sin APIs reales
        run: |
          python -m pip check
          python -m pytest -p no:cacheprovider tests/ -q

  docker:
    name: Construir frontend y backend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Construir backend sin publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          target: backend
          push: false
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
      - name: Construir frontend sin publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          target: frontend
          push: false
          cache-from: type=gha,scope=app

  terraform:
    name: Validar Terraform (${{ matrix.directory }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        directory: [infra/bootstrap, infra/environments/dev]
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.17.1'
          terraform_wrapper: false
      - name: Comprobar formato de los archivos versionados
        run: |
          git ls-files -z -- '*.tf' | xargs -0 -r terraform fmt -check
      - name: Inicializar sin acceder al estado S3
        run: terraform init -backend=false -input=false -lockfile=readonly
      - name: Validar configuración
        run: terraform validate -no-color

  publish:
    name: Publicar ${{ matrix.service }} en ECR DEV
    # PR: solo validación. Publicar exclusivamente tras un push a main; una
    # ejecución manual del CI tampoco publica ni enciende la EC2.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [tests, docker, terraform]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    env:
      ECR_REGISTRY: 086358667619.dkr.ecr.eu-west-1.amazonaws.com
      AWS_REGION: eu-west-1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Obtener credenciales temporales de DEV
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::086358667619:role/homologaciones-dev-github-deploy
          aws-region: eu-west-1
          audience: sts.amazonaws.com
          allowed-account-ids: '086358667619'
          role-session-name: github-ecr-${{ github.run_id }}-${{ matrix.service }}
          role-duration-seconds: 3600
          unset-current-credentials: true
      - name: Preparar referencia inmutable de la imagen
        id: image
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          # El SHA permite identificar el código; run_id y run_attempt evitan
          # sobrescribir una etiqueta ECR inmutable al repetir una ejecución.
          tag="sha-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "uri=${ECR_REGISTRY}/homologaciones-dev/${SERVICE}:$tag" >> "$GITHUB_OUTPUT"
      - name: Autenticar Docker en ECR
        run: |
          set -euo pipefail
          aws ecr get-login-password --region "$AWS_REGION" |
            docker login --username AWS --password-stdin "$ECR_REGISTRY"
      - name: Construir y publicar imagen
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.service }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.uri }}
          cache-from: |
            type=gha,scope=publish-${{ matrix.service }}
            type=gha,scope=app
          cache-to: type=gha,mode=max,scope=publish-${{ matrix.service }}
      - name: Registrar versión publicada
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          SERVICE: ${{ matrix.service }}
        run: |
          {
            printf '### Imagen %s publicada en DEV\n\n' "$SERVICE"
            printf -- '- Commit: %s\n' "$GITHUB_SHA"
            printf -- '- Imagen: %s\n' "$IMAGE_URI"
            printf -- '- Digest: %s\n' "$IMAGE_DIGEST"
            printf '\nPublicar en ECR no actualiza ni enciende la EC2.\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Cerrar sesión Docker
        if: always()
        run: docker logout "$ECR_REGISTRY"
