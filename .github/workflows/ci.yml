name: Validar, publicar y desplegar DEV

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # PR: cancelar checks obsoletos. Main: no interrumpir una actualización o su
  # paso de apagado; los despliegues se procesan sin cancelación automática.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Tests Python
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENAI_API_KEY: sk-test-placeholder
      PROVEEDOR_RAZONAMIENTO: openai
      PROVEEDOR_REDACCION: openai
      AWS_ACCESS_KEY_ID: testing
      AWS_SECRET_ACCESS_KEY: testing
      AWS_EC2_METADATA_DISABLED: 'true'
      LANGCHAIN_TRACING_V2: 'false'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt pytest==8.3.5
      - name: Comprobar dependencias y ejecutar tests sin APIs reales
        run: |
          python -m pip check
          python -m pytest -p no:cacheprovider tests/ -q

  docker:
    name: Construir frontend y backend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Construir backend sin publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          target: backend
          push: false
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
      - name: Construir frontend sin publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          target: frontend
          push: false
          cache-from: type=gha,scope=app

  terraform:
    name: Validar Terraform (${{ matrix.directory }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        directory: [infra/bootstrap, infra/environments/dev]
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.17.1'
          terraform_wrapper: false
      - name: Comprobar formato de los archivos versionados
        run: |
          git ls-files -z -- '*.tf' | xargs -0 -r terraform fmt -check
      - name: Inicializar sin acceder al estado S3
        run: terraform init -backend=false -input=false -lockfile=readonly
      - name: Validar configuración
        run: terraform validate -no-color

  release:
    name: Preparar version DEV
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [tests, docker, terraform]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Fijar etiqueta compartida de esta entrega
        id: version
        run: echo "tag=sha-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

  publish:
    name: Publicar ${{ matrix.service }} en ECR DEV
    # PR: solo validación. Publicar exclusivamente tras un push a main; una
    # ejecución manual del CI tampoco publica ni enciende la EC2.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [tests, docker, terraform, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    env:
      ECR_REGISTRY: 086358667619.dkr.ecr.eu-west-1.amazonaws.com
      AWS_REGION: eu-west-1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Obtener credenciales temporales de DEV
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::086358667619:role/homologaciones-dev-github-deploy
          aws-region: eu-west-1
          audience: sts.amazonaws.com
          allowed-account-ids: '086358667619'
          role-session-name: github-ecr-${{ github.run_id }}-${{ matrix.service }}
          role-duration-seconds: 3600
          unset-current-credentials: true
      - name: Preparar referencia inmutable de la imagen
        id: image
        env:
          SERVICE: ${{ matrix.service }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          # Usar siempre la versión del job release, también al repetir solo
          # jobs fallidos. No calcular otro tag con el run_attempt del reintento.
          tag="$RELEASE_TAG"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "uri=${ECR_REGISTRY}/homologaciones-dev/${SERVICE}:$tag" >> "$GITHUB_OUTPUT"
      - name: Autenticar Docker en ECR
        run: |
          set -euo pipefail
          aws ecr get-login-password --region "$AWS_REGION" |
            docker login --username AWS --password-stdin "$ECR_REGISTRY"
      - name: Construir y publicar imagen
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.service }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.uri }}
          cache-from: |
            type=gha,scope=publish-${{ matrix.service }}
            type=gha,scope=app
          cache-to: type=gha,mode=max,scope=publish-${{ matrix.service }}
      - name: Registrar versión publicada
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          SERVICE: ${{ matrix.service }}
        run: |
          {
            printf '### Imagen %s publicada en DEV\n\n' "$SERVICE"
            printf -- '- Commit: %s\n' "$GITHUB_SHA"
            printf -- '- Imagen: %s\n' "$IMAGE_URI"
            printf -- '- Digest: %s\n' "$IMAGE_DIGEST"
            printf '\nEl job de despliegue espera a que se publiquen ambas imagenes.\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Cerrar sesión Docker
        if: always()
        run: docker logout "$ECR_REGISTRY"

  deploy:
    name: Actualizar EC2 DEV y restaurar estado
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [release, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    concurrency:
      group: ec2-homologaciones-dev
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ needs.release.outputs.tag }}
      AWS_RETRY_MODE: standard
      AWS_MAX_ATTEMPTS: '3'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preparar registro temporal del ciclo de vida
        run: echo "DEPLOY_STATE_FILE=${RUNNER_TEMP}/homologaciones-dev-state.json" >> "$GITHUB_ENV"
      - name: Obtener credenciales temporales de despliegue
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::086358667619:role/homologaciones-dev-github-deploy
          aws-region: eu-west-1
          audience: sts.amazonaws.com
          allowed-account-ids: '086358667619'
          role-session-name: github-deploy-${{ github.run_id }}
          role-duration-seconds: 3600
          unset-current-credentials: true
      - name: Guardar estado inicial y preparar EC2 y SSM
        run: python deploy/ec2_lifecycle.py prepare --state-file "$DEPLOY_STATE_FILE"
      - name: Ejecutar y comprobar el documento de despliegue
        run: python deploy/ec2_lifecycle.py execute --state-file "$DEPLOY_STATE_FILE" --image-tag "$RELEASE_TAG"
      - name: Restaurar el estado inicial de la EC2
        if: always()
        run: |
          if [ -n "${DEPLOY_STATE_FILE:-}" ]; then
            python deploy/ec2_lifecycle.py restore --state-file "$DEPLOY_STATE_FILE"
          fi
      - name: Resumen del despliegue
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ.get('DEPLOY_STATE_FILE', ''))
          state = json.loads(path.read_text()) if path.is_file() else {}
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('### Despliegue EC2 DEV\n\n')
              summary.write(f"- Version: {os.environ['RELEASE_TAG']}\n")
              summary.write(f"- Estado inicial: {state.get('initial_state', 'no registrado')}\n")
              summary.write(f"- Actualizacion confirmada: {state.get('deployment_succeeded', False)}\n")
              summary.write(f"- Ciclo de vida finalizado: {state.get('restored', False)}\n")
              summary.write('\nSi DEV estaba apagado, debe volver a stopped. Si falla la limpieza, comprobar AWS y pausarlo manualmente.\n')
          PY
