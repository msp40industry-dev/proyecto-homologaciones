# Usar junto con compose.ec2.yml, no de forma independiente.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?Configura PUBLIC_DOMAIN en el archivo de entorno seleccionado}
    volumes:
      - type: bind
        source: ${CADDY_CONFIG_PATH:-./deploy/caddy}
        target: /etc/caddy
        read_only: true
        bind:
          create_host_path: false
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
